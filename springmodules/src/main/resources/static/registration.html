<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Details</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f6f8; }
        input { padding: 8px; margin: 8px; width: 250px; }
        button { padding: 10px 18px; margin-top: 10px; background: #3498db; color: white; border: none; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<h1>Enter Registration Details</h1>

<div>
    <input type="number" id="regId" placeholder="Registration ID"><br>
    <input type="number" id="studId" placeholder="Student ID"><br>
    <input type="text" id="regDate" placeholder="Registration Date (yyyy-MM-dd)"><br>
    <input type="text" id="govId" placeholder="Government ID"><br>
    <input type="text" id="isNative" placeholder="Is Native (true/false)"><br>

    <button onclick="submitRegistration()">Submit Registration</button>
</div>

<script>
async function submitRegistration() {
    const regId = document.getElementById('regId').value;
    const studId = document.getElementById('studId').value;
    const regDate = document.getElementById('regDate').value;
    const govId = document.getElementById('govId').value;
    const isNative = document.getElementById('isNative').value;

    if (!regId || !studId || !regDate || !govId || !isNative) {
        alert("Fill all fields!");
        return;
    }

    // Create your pipe-separated string
    const finalString = `${regId}|${studId}|${regDate}|${govId}|${isNative}`;

    // Send to your API
    const url = `students/registration/Update?registrationDetails=${encodeURIComponent(finalString)}`;

    const res = await fetch(url, {
        method: 'POST'
    });

    if (res.ok) {
        alert("Registration saved successfully!");
    } else {
        alert("Error saving registration.");
    }
}
</script>

</body>
</html>
