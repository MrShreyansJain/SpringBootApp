<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Details</title>
  <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f8;
        }
        h1 {
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
<h1>Student Details</h1>

<div>
  <input type="text" id="firstName" placeholder="First Name">
  <input type="text" id="lastName" placeholder="Last Name">
  <input type="number" id="classNo" placeholder="Class No">
  <input type="text" id="section" placeholder="Section">
  <button onclick="addStudent()">Add Student</button>
</div>

<table id="studentTable">
  <thead>
  <tr>
    <th>ID</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Class No</th>
    <th>Section</th>
  </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const apiUrl = '/students';

async function loadStudents() {
    const res = await fetch(apiUrl+'/fetch');
    const students = await res.json();
    const tbody = document.querySelector('#studentTable tbody');
    tbody.innerHTML = '';

    students.forEach(s => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${s.id}</td>
            <td>${s.firstName}</td>
            <td>${s.lastName}</td>
            <td>${s.classNo}</td>
            <td>${s.section}</td>
        `;
        tbody.appendChild(row);
    });
}

async function addStudent() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const classNo = parseInt(document.getElementById('classNo').value);
    const section = document.getElementById('section').value.trim();

    if (!firstName || !lastName || !classNo || !section) {
        alert('Please fill all fields.');
        return;
    }

    await fetch(apiUrl+'/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ firstName, lastName, classNo, section })
    });

    document.getElementById('firstName').value = '';
    document.getElementById('lastName').value = '';
    document.getElementById('classNo').value = '';
    document.getElementById('section').value = '';
    loadStudents();
}

loadStudents();
</script>
</body>
</html>
